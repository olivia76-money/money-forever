<script>
const PEOPLE=['鳳雪','忠村'], STORAGE_KEY='money-forever-jobs-v1'; let jobs=[], currentView=new Date(), editingId=null, activeDayKey=null, currentFormType='job'; currentView.setDate(1);
const SUPABASE_URL='https://rlyiysopaweeibmdsgiq.supabase.co', SUPABASE_KEY='sb_publishable_OdmyoaJ3UJ_0M27heF9c-Q_hBcOBDQH', CLOUD_URL=SUPABASE_URL+'/rest/v1/jobs';

async function loadJobs(){
  let local=[];
  try{local=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){}
  try{
    const r=await fetch(CLOUD_URL+'?select=id,data&id=eq.1',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
    if(!r.ok)throw new Error(await r.text());
    const rows=await r.json();
    if(rows.length && Array.isArray(rows[0].data)){
      jobs=rows[0].data;
      localStorage.setItem(STORAGE_KEY,JSON.stringify(jobs));
    }else{
      jobs=Array.isArray(local)?local:[];
      if(jobs.length) await cloudSave();
    }
  }catch(e){
    console.error('雲端讀取失敗',e);
    jobs=Array.isArray(local)?local:[];
  }
}
async function cloudSave(){
  const r=await fetch(CLOUD_URL+'?on_conflict=id',{
    method:'POST',
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json',
      Prefer:'resolution=merge-duplicates,return=minimal'
    },
    body:JSON.stringify({id:1,data:jobs})
  });
  if(!r.ok)throw new Error(await r.text());
}
function saveJobs(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(jobs));
    cloudSave().catch(e=>{console.error('雲端儲存失敗',e);alert('資料已暫存在此裝置，但雲端同步失敗。請確認網路後再試一次。')});
    return true;
  }catch(e){
    alert('儲存失敗。請確認瀏覽器儲存空間。');
    return false;
  }
}
const pad=n=>String(n).padStart(2,'0'), dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}, mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};
function hoursBetween(s,e){let a=mins(s),b=mins(e);if(b<=a)b+=1440;return(b-a)/60} function amountFor(j,p){if(j.type==='note')return 0;let a=(j.assignments||[]).find(x=>x.person===p);return !a?0:a.payType==='daily'?Number(a.rate)||0:hoursBetween(j.start,j.end)*(Number(a.rate)||0)}
function uid(){return'j'+Date.now()+Math.random().toString(36).slice(2,7)}
function renderCalendar(){monthLabel.textContent=`${currentView.getFullYear()} 年 ${currentView.getMonth()+1} 月`;calGrid.innerHTML='';let y=currentView.getFullYear(),m=currentView.getMonth(),off=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells=[];for(let i=off-1;i>=0;i--)cells.push({d:prev-i,o:1,x:new Date(y,m-1,prev-i)});for(let d=1;d<=days;d++)cells.push({d,o:0,x:new Date(y,m,d)});while(cells.length<42){let n=cells.length-(off+days)+1;cells.push({d:n,o:1,x:new Date(y,m+1,n)})}cells.forEach(c=>{let el=document.createElement('div'),k=dateKey(c.x);el.className='cal-cell'+(c.o?' other-month':'')+(dateKey(new Date())===k?' today':'');let js=jobs.filter(j=>j.type==='note'?k>=j.date&&k<=(j.endDate||j.date):j.date===k);el.innerHTML=`<div class="daynum">${c.d}</div><div class="chip-list">${js.slice(0,3).map(j=>`<div class="chip ${j.type==='note'?'p-note':j.assignments.length>1?'p-both':'p-'+j.assignments[0].person}">${esc(j.name)}</div>`).join('')}${js.length>3?`<div class="chip">+${js.length-3} 筆</div>`:''}</div>`;el.onclick=()=>openDay(k);calGrid.appendChild(el)})}
function openDay(k){activeDayKey=k;dayPanelTitle.textContent=k.replaceAll('-','/');renderDay();dayOverlay.classList.add('active')}
function renderDay(){let js=jobs.filter(j=>j.type==='note'?activeDayKey>=j.date&&activeDayKey<=(j.endDate||j.date):j.date===activeDayKey);dayJobList.innerHTML=js.length?'':'<div class="empty-note">這天還沒有安排工作或行程</div>';js.forEach(j=>{let el=document.createElement('div');el.className='day-job-item';let detail=j.type==='note'?(j.allDay?'全天':j.time||''):(j.start+' – '+j.end);el.innerHTML=`<div class="info"><div class="jname">${esc(j.name)}</div><div class="jtime">${detail}${j.note?' · '+esc(j.note):''}</div><div class="jpeople">${j.type==='note'?'<span class="tag p-note">一般行程</span>':j.assignments.map(a=>`<span class="tag p-${a.person}">${a.person}｜${a.payType==='daily'?'日薪':'時薪'} ${a.rate}｜$${Math.round(amountFor(j,a.person)).toLocaleString()}</span>`).join('')}</div></div><div class="job-actions"><button class="icon-btn edit">編輯</button><button class="icon-btn del">刪除</button></div>`;el.querySelector('.edit').onclick=()=>openForm(j.id);el.querySelector('.del').onclick=()=>{if(confirm('確定要刪除這筆資料嗎？')){jobs=jobs.filter(x=>x.id!==j.id);saveJobs();renderDay();renderCalendar()}};dayJobList.appendChild(el)})}
function setType(t){currentFormType=t;document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===t));jobTimeFields.style.display=t==='job'?'grid':'none';noteTimeFields.style.display=t==='note'?'block':'none';jobPeopleFields.style.display=t==='job'?'block':'none';nameLabel.textContent=t==='job'?'工作名稱':'行程名稱';dateLabel.textContent=t==='job'?'日期':'起始日期'}
function reset(t='job'){f('name').value='';f('date').value=activeDayKey||dateKey(new Date());f('note').value='';f('start').value='09:00';f('end').value='17:00';f('enddate').value=activeDayKey||dateKey(new Date());f('allday').checked=false;f('notetime').value='09:00';PEOPLE.forEach(p=>{document.getElementById('chk-'+p).checked=false;document.getElementById('rate-'+p).value='';document.getElementById('block-'+p).classList.add('disabled')});setType(t)}
function f(x){return document.getElementById('f-'+x)}
function openForm(id=null,t='job'){editingId=id;reset(t);if(id){let j=jobs.find(x=>x.id===id);setType(j.type);formTitle.textContent='編輯'+(j.type==='note'?'一般行程':'工作');f('name').value=j.name;f('date').value=j.date;f('note').value=j.note||'';if(j.type==='note'){f('enddate').value=j.endDate||j.date;f('allday').checked=!!j.allDay;f('notetime').value=j.time||'09:00'}else{f('start').value=j.start;f('end').value=j.end;j.assignments.forEach(a=>{document.getElementById('chk-'+a.person).checked=true;document.getElementById('block-'+a.person).classList.remove('disabled');document.querySelector(`input[name="pay-${a.person}"][value="${a.payType}"]`).checked=true;document.getElementById('rate-'+a.person).value=a.rate})}}else formTitle.textContent='新增'+(t==='note'?'一般行程':'工作');dayOverlay.classList.remove('active');formOverlay.classList.add('active')}
function handleSave(){let name=f('name').value.trim(),date=f('date').value,note=f('note').value.trim();if(!name||!date){alert('請填寫名稱與日期');return}let r;if(currentFormType==='note'){let endDate=f('enddate').value||date;if(endDate<date){alert('結束日期不能早於起始日期');return}r={type:'note',name,date,endDate,note,allDay:f('allday').checked,time:f('allday').checked?'':f('notetime').value}}else{let as=[];PEOPLE.forEach(p=>{if(document.getElementById('chk-'+p).checked)as.push({person:p,payType:document.querySelector(`input[name="pay-${p}"]:checked`).value,rate:Number(document.getElementById('rate-'+p).value)||0})});if(!as.length){alert('請至少選擇一位人員');return}r={type:'job',name,date,start:f('start').value,end:f('end').value,note,assignments:as}}if(editingId){let i=jobs.findIndex(j=>j.id===editingId);jobs[i]={...jobs[i],...r}}else jobs.push({id:uid(),...r});if(saveJobs()){formOverlay.classList.remove('active');renderCalendar();activeDayKey=date;openDay(date)}}
function populateMonths(){let s=new Set(jobs.map(j=>j.date.slice(0,7)));let n=new Date();s.add(`${n.getFullYear()}-${pad(n.getMonth()+1)}`);settleMonth.innerHTML=[...s].sort().reverse().map(m=>`<option value="${m}">${m.slice(0,4)} 年 ${Number(m.slice(5))} 月</option>`).join('')let savedMonth=localStorage.getItem('money-forever-settle-month');if(savedMonth&&[...settleMonth.options].some(o=>o.value===savedMonth))settleMonth.value=savedMonth;}
function renderSettlement(){let m=settleMonth.value,ps=settlePerson.value==='all'?PEOPLE:[settlePerson.value];settleResults.innerHTML='';ps.forEach(p=>{let js=jobs.filter(j=>j.type==='job'&&j.date.startsWith(m)&&(j.assignments||[]).some(a=>a.person===p)),tot=js.reduce((s,j)=>s+amountFor(j,p),0),card=document.createElement('div');card.className='settle-card';card.dataset.person=p;card.innerHTML=`<div class="settle-card-head"><div class="settle-name ${p}">${p}</div><div class="seal-total"><div class="amt">$${Math.round(tot).toLocaleString()}</div><div class="lbl">本月應領</div></div></div>${js.length?`<table><thead><tr><th>日期</th><th>工作</th><th>方式</th><th class="amt">金額</th></tr></thead><tbody>${js.sort((a,b)=>a.date.localeCompare(b.date)).map(j=>{let a=j.assignments.find(x=>x.person===p);return`<tr><td>${j.date.slice(5).replace('-','/')}</td><td>${esc(j.name)}</td><td>${a.payType==='daily'?'日薪':'時薪'}</td><td class="amt">$${Math.round(amountFor(j,p)).toLocaleString()}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty-note">這個月尚無工作記錄</div>'}`;settleResults.appendChild(card)})}
function exportCsv(){let rows=[['日期','名稱','開始','結束','人員','計薪方式','費率','金額','備註','類型']];jobs.forEach(j=>{if(j.type==='note')rows.push([j.date,j.name,j.allDay?'全天':j.time,j.endDate||j.date,'','','','',j.note||'','一般行程']);else j.assignments.forEach(a=>rows.push([j.date,j.name,j.start,j.end,a.person,a.payType==='daily'?'日薪':'時薪',a.rate,Math.round(amountFor(j,a.person)),j.note||'','工作']))});let csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MoneyForever_Backup.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function parseLine(l){let r=[],c='',q=false;for(let i=0;i<l.length;i++){let x=l[i];if(q){if(x==='"'&&l[i+1]==='"'){c+='"';i++}else if(x==='"')q=false;else c+=x}else if(x==='"')q=true;else if(x===','){r.push(c);c=''}else c+=x}r.push(c);return r}
async function importCsv(file){let text=(await file.text()).replace(/^\uFEFF/,''),rows=text.split(/\r?\n/).filter(Boolean).slice(1).map(parseLine),map=new Map(),notes=[];rows.forEach(r=>{let[date,name,start,end,person,pay,rate,amt,note,type]=r;if(!date)return;if(type==='一般行程')notes.push({id:uid(),type:'note',name,date,endDate:end||date,note:note||'',allDay:start==='全天',time:start==='全天'?'':start});else if(person){let k=[date,name,start,end].join('|');if(!map.has(k))map.set(k,{id:uid(),type:'job',name,date,start,end,note:note||'',assignments:[]});map.get(k).assignments.push({person,payType:pay==='日薪'?'daily':'hourly',rate:Number(rate)||0})}});let x=[...map.values(),...notes];if(x.length&&confirm(`讀到 ${x.length} 筆資料，要新增進目前資料嗎？`)){jobs.push(...x);saveJobs();renderCalendar();populateMonths();renderSettlement();alert('匯入完成！')}}
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('view-'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='settle'){populateMonths();renderSettlement()}});document.querySelectorAll('.type-btn').forEach(b=>b.onclick=()=>setType(b.dataset.type));PEOPLE.forEach(p=>document.getElementById('chk-'+p).onchange=e=>document.getElementById('block-'+p).classList.toggle('disabled',!e.target.checked));
prevMonth.onclick=()=>{currentView.setMonth(currentView.getMonth()-1);renderCalendar()};nextMonth.onclick=()=>{currentView.setMonth(currentView.getMonth()+1);renderCalendar()};gotoToday.onclick=()=>{currentView=new Date();currentView.setDate(1);renderCalendar()};closeDayPanel.onclick=()=>dayOverlay.classList.remove('active');closeFormPanel.onclick=cancelForm.onclick=()=>formOverlay.classList.remove('active');openAddJob.onclick=()=>openForm();openAddNote.onclick=()=>openForm(null,'note');saveJob.onclick=handleSave;settleMonth.onchange=()=>{localStorage.setItem('money-forever-settle-month',settleMonth.value);renderSettlement()};settlePerson.onchange=renderSettlement;exportCsv.onclick=exportCsv;importCsvBtn.onclick=()=>importCsvFile.click();importCsvFile.onchange=e=>{if(e.target.files[0])importCsv(e.target.files[0]);e.target.value=''};f('allday').onchange=e=>noteTimeWrap.style.display=e.target.checked?'none':'block';
(async()=>{await loadJobs();renderCalendar();})();
</script>
</body></html>
